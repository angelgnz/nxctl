[workspace]
resolver = "2"
members = [
    "crates/nxctl-core",
    "crates/nxctl",
    "crates/nxctld",
    "crates/nxctl-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
ctrlc = "3"
signal-hook = "0.3"
ratatui = "0.30.2"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui_plot = "0.38"
